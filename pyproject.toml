[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quilt-canon-mcp"
version = "0.1.0"
description = "MCP (Model Context Protocol) server exposing Quilt substrate walker canon as tools for AI agents"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "SuperInstance", email = "[email protected]"},
]
keywords = ["mcp", "model-context-protocol", "canon", "quilt", "substrate-walker", "ai-agent-tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
]

[project.scripts]
quilt-canon-mcp = "quilt_canon_mcp.server:run_server"
quilt-canon-mcp-cli = "quilt_canon_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quilt_canon_mcp*"]
